name: Deploy AstroPaper to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog content and configuration
        uses: actions/checkout@v4
        with:
          path: blog

      - name: Checkout AstroPaper
        uses: actions/checkout@v4
        with:
          repository: satnaing/astro-paper
          ref: main
          path: site

      - name: Apply blog configuration
        run: |
          cp blog/astro-paper.config.ts site/astro-paper.config.ts
          cp blog/astro.config.ts site/astro.config.ts

          rm -rf site/src/content/posts
          mkdir -p site/src/content/posts
          if [ -d blog/src/content/posts ]; then
            cp -R blog/src/content/posts/. site/src/content/posts/
          fi

          if [ -d blog/src/assets/icons/socials ]; then
            cp -R blog/src/assets/icons/socials/. site/src/assets/icons/socials/
          fi

          if [ -f blog/src/pages/index.astro ]; then
            cp blog/src/pages/index.astro site/src/pages/index.astro
          fi

          if [ -d blog/public ]; then
            cp -R blog/public/. site/public/
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
